*{box-sizing:border-box;margin:0;padding:0}

.rear{background:#151D28;box-shadow:0 36px 80px #05070A55}

.device-screen{position:absolute;left:15px;top:15px;width:540px;height:1170px;border-radius:72px;overflow:hidden;background:#05070A;box-shadow:0 0 0 1px #05070A}

<script>
// Material plates are built once, at load. Every plate belongs to the same
// rigid 3D object; the recording is placed once and stays continuous.
const device = document.getElementById("device");
const front = device.querySelector(".front");
for (let depth = 35; depth >= 1; depth--) {
  const layer = document.createElement("div");
  layer.className = "body-layer";
  layer.setAttribute("aria-hidden", "true");
  layer.style.transform = `translateZ(${-depth}px)`;
  device.insertBefore(layer, front);
}
const tl = gsap.timeline({paused:true});
tl.set("#camera", {"x":30,"y":-15,"z":-200,"scale":1.01},0);
tl.set("#device", {"rotationX":26,"rotationY":-22,"rotationZ":16},0);
// Absolute pose ladder. Camera and object each own disjoint transform channels.
tl.addLabel("contexto-inicial",0);
tl.to("#camera", {"x":0,"y":0,"z":-50,"scale":1.22,"duration":1.4,"ease":"power2.inOut"},0);
tl.to("#device", {"rotationX":24,"rotationY":-24,"rotationZ":16,"duration":1.4,"ease":"power2.inOut"},0);
tl.addLabel("abrir-provas",3.5);
tl.to("#camera", {"x":0,"y":-90,"z":10,"scale":1.35,"duration":1.2,"ease":"power2.inOut"},3.5);
tl.to("#device", {"rotationX":18,"rotationY":-18,"rotationZ":10,"duration":1.2,"ease":"power2.inOut"},3.5);
tl.addLabel("clima-prova-alvo",5.3);
tl.to("#camera", {"x":0,"y":-180,"z":55,"scale":1.55,"duration":1,"ease":"power2.inOut"},5.3);
tl.to("#device", {"rotationX":10,"rotationY":-10,"rotationZ":5,"duration":1,"ease":"power2.inOut"},5.3);
tl.addLabel("abrir-cadastro",7);
tl.to("#camera", {"x":0,"y":0,"z":-20,"scale":1.25,"duration":1,"ease":"power2.inOut"},7);
tl.to("#device", {"rotationX":18,"rotationY":-20,"rotationZ":10,"duration":1,"ease":"power2.inOut"},7);
tl.addLabel("nome-local",9.4);
tl.to("#camera", {"x":0,"y":-35,"z":35,"scale":1.48,"duration":1.1,"ease":"power2.inOut"},9.4);
tl.to("#device", {"rotationX":12,"rotationY":-13,"rotationZ":7,"duration":1.1,"ease":"power2.inOut"},9.4);
tl.addLabel("escolher-data",12.2);
tl.to("#camera", {"x":0,"y":-110,"z":50,"scale":1.53,"duration":1.2,"ease":"power2.inOut"},12.2);
tl.to("#device", {"rotationX":10,"rotationY":-11,"rotationZ":6,"duration":1.2,"ease":"power2.inOut"},12.2);
tl.addLabel("dados-da-prova",15.7);
tl.to("#camera", {"x":0,"y":-95,"z":35,"scale":1.46,"duration":1.2,"ease":"power2.inOut"},15.7);
tl.to("#device", {"rotationX":12,"rotationY":-15,"rotationZ":8,"duration":1.2,"ease":"power2.inOut"},15.7);
tl.addLabel("confirmacao",18.2);
tl.to("#camera", {"x":0,"y":60,"z":-20,"scale":1.25,"duration":1.1,"ease":"power2.inOut"},18.2);
tl.to("#device", {"rotationX":18,"rotationY":-18,"rotationZ":10,"duration":1.1,"ease":"power2.inOut"},18.2);
tl.addLabel("prova-cadastrada",20.2);
tl.to("#camera", {"x":0,"y":-90,"z":25,"scale":1.42,"duration":1.1,"ease":"power2.inOut"},20.2);
tl.to("#device", {"rotationX":13,"rotationY":-13,"rotationZ":7,"duration":1.1,"ease":"power2.inOut"},20.2);
tl.addLabel("aproximar-clima-data-da-prova",23.2);
tl.to("#camera", {"x":0,"y":-250,"z":75,"scale":1.72,"duration":1.3,"ease":"power2.inOut"},23.2);
tl.to("#device", {"rotationX":8,"rotationY":-8,"rotationZ":4,"duration":1.3,"ease":"power2.inOut"},23.2);
tl.addLabel("retorno-provas",25.9);
tl.to("#camera", {"x":0,"y":-100,"z":15,"scale":1.38,"duration":1,"ease":"power2.inOut"},25.9);
tl.to("#device", {"rotationX":14,"rotationY":-16,"rotationZ":8,"duration":1,"ease":"power2.inOut"},25.9);
tl.addLabel("fechamento",28.8);
tl.to("#camera", {"x":25,"y":0,"z":-130,"scale":1.03,"duration":1.3,"ease":"power2.inOut"},28.8);
tl.to("#device", {"rotationX":24,"rotationY":-24,"rotationZ":16,"duration":1.3,"ease":"power2.inOut"},28.8);
tl.fromTo(".ambient-light", {x:-45,y:25,scale:0.98}, {x:55,y:-30,scale:1.08,duration:30.6,ease:"sine.inOut"},0);
tl.to(".ground-shadow", {"scaleX":0.85,"opacity":0.65,"duration":1.3,"ease":"power2.inOut"},23.2);
tl.to(".ground-shadow", {"scaleX":1,"opacity":1,"duration":1.3,"ease":"power2.inOut"},28.8);
window.__timelines["main"] = tl;
